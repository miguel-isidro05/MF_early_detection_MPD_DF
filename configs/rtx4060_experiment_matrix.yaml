name: rtx4060_eeg_experiment_matrix
seed: 42
hardware: NVIDIA_RTX_4060
main_tasks: [A]
models: [psd_svm, random_forest, eegnet]
window_seconds: [1]
protocol_order:
  - within_subject_grouped
  - leave_one_subject_out
primary_task: A
reference_task: null
primary_metric: subject_macro_f1
secondary_metrics:
  - subject_macro_balanced_accuracy
  - subject_macro_recall
  - subject_macro_specificity
artifact_policy: exclude_8_9
seed_policy: single_global_seed_42
primary_preprocessing: physiological_validation
primary_preprocessing_status: >-
  Paper-described EEG visualization order: 1-100 Hz bandpass, 50 Hz notch,
  mean removal, 200 Hz resampling, then per-window/channel z-score. ICA is
  Figure 11-specific and is not precomputed for classification.
deep_defaults:
  epochs: 50
  patience: 8
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0001
