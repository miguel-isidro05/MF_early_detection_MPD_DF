name: task_b_early_fatigue_plus_drowsiness
seed: 42
task: B
scope: EEG-only; Wakefulness versus Fatigue1+Fatigue2; MSCNN-CAM and Task C excluded.
primary_montage: edf32
channel_ablation_montage: paper28
window_sec: 1
stride_sec: 1
artifact_policy: exclude_signal_abnormality_and_severe_artifacts
within_subject:
  outer_split: StratifiedGroupKFold
  outer_folds: 5
  group: fixed_30_second_annotation_bin
  filter_scope: group_bounded
loso:
  outer_split: LeaveOneGroupOut_by_subject
  inner_split: StratifiedGroupKFold_by_subject
  inner_folds: 5
  filter_scope: subject_continuous
preprocessing:
  primary_signal_operations: [bandpass_1_100_hz, notch_50_hz, demean, resample_200_hz]
  eegnet_primary_normalization: per_window_channel_zscore
  psd_primary_normalization: none_before_psd
  psd_absolute_power: 10_log10_power_db
  psd_power_ratios: 10_log10_ratio_db
  psd_scaling: train_fold_standard_scaler
  diagnostic_profiles:
    - paper_1_100_per_window_channel_zscore
    - paper_1_100_no_window_zscore
    - annotation_0_3_35_no_window_zscore
    - annotation_0_3_35_per_window_global_zscore
    - annotation_0_3_35_microvolt_scale
  diagnostic_windows_sec: [1, 5, 10]
  diagnostic_transition_guard_sec: [0, 10]
  ica: excluded_from_primary_classification
selection:
  primary_metric: fatigue_class_f1
  tie_breakers: [fatigue_class_recall, cohens_kappa, balanced_accuracy]
  threshold_selection: inner_validation_only
  eegnet_refit_epochs: best_inner_validation_epoch
svm_solver:
  max_iter: 50000
  tolerance: 0.001
  convergence_warning: fail_run
models:
  - psd_svm
  - random_forest
  - eegnet
